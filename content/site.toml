# LIMEN RESEARCH 사이트 설정
# 이 파일을 고치면 사이트 전체에 반영됩니다.

# 사이트 주소. 도메인을 연결하면 예: "https://limenresearch.com" 으로 바꾸세요.
site_url = "https://junhyukchunjae-bit.github.io/limen-research"

# 사이트 언어. 첫 번째가 기본 언어입니다.
# 영어를 열 때: languages = ["ko", "en"]  → /en/ 아래에 영어 사이트가 생깁니다.
languages = ["ko"]

# 문의 이메일 (사이트 하단·구매 문의 버튼에 표시). TODO: 실제 주소로 교체
email = "contact@example.com"

# 판매처. 보고서 파일의 buy_url(상품 주소)로 가는 버튼에 "○○에서 구매"로 표시됩니다.
store = "교보문고"

[ko]
tagline = "기술의 문턱 너머를 먼저 읽습니다"
description = "LIMEN RESEARCH는 모빌리티, 통신, 전자, 국방, 금융, IT 산업의 전환점을 분석한 심층 보고서를 매주 발행합니다."

[en]
tagline = "Reading past the threshold of technology"
description = "LIMEN RESEARCH publishes weekly in-depth reports on turning points in mobility, telecom, electronics, defense, finance and IT."

# 다루는 분야. key는 보고서 파일의 sectors 에 씁니다.
# code는 표지 아래 분야 칸에 찍히는 약자입니다 (영문 대문자 2~3자).
[[sectors]]
key = "mobility"
code = "MOB"
ko = "모빌리티"
en = "Mobility"

[[sectors]]
key = "telecom"
code = "TEL"
ko = "통신"
en = "Telecom"

[[sectors]]
key = "electronics"
code = "SEM"
ko = "전자·반도체"
en = "Electronics"

[[sectors]]
key = "defense"
code = "DEF"
ko = "국방"
en = "Defense"

[[sectors]]
key = "finance"
code = "FIN"
ko = "금융"
en = "Finance"

[[sectors]]
key = "it"
code = "SW"
ko = "IT·소프트웨어"
en = "IT & Software"

# 여러 분야를 함께 다루는 전망·트렌드 보고서용
[[sectors]]
key = "cross"
code = "ALL"
ko = "종합"
en = "Cross-sector"

# 사업자 정보. 사업자등록 후 채우면 사이트 하단에 표시됩니다.
# 비워 두면 표시하지 않습니다.
[business]
name = ""
owner = ""
reg_no = ""
address = ""
