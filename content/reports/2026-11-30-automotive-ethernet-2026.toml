title = "차량용 이더넷 2026"
subtitle = "IEEE SA 행사 발표 25건과 802 표준 문서, 중국 공시로 읽는 엣지 이더넷과 카메라 링크"
summary = "2026년 10월 IEEE SA 차량용 이더넷 행사의 발표 25건을 참관하고, IEEE 802 표준 문서와 미국·중국 공시에 대조해 엣지 이더넷과 카메라 링크의 병목을 가려냈습니다."
quote = "이틀 동안 가장 많이 나온 주제는 가장 느린 이더넷이었다."
quote_source = "머리말"
body = """
차량용 이더넷의 표준은 10 Mb/s에서 광 50 Gb/s까지 이미 나와 있습니다. 그런데 백본 속도가 공개된 2026년 양산 존 구조 차량의 백본은 모두 1 Gb/s이고, 차의 엣지는 여전히 CAN과 LIN이 맡습니다. 10 Mb/s 이더넷 10BASE-T1S를 엣지에 쓴 양산차는 BMW Neue Klasse 한 계열뿐입니다.

2026년 10월 14–15일 스웨덴 예테보리에서 열린 IEEE SA Ethernet & IP @ Automotive Technology Day를 참관했습니다. 키노트와 기술 발표 20건 가운데 8건이 10BASE-T1S와 원격 제어 프로토콜(RCP)을 다뤘고, 한 해 전에는 같은 기준으로 3건이었습니다. 이 책은 돌아와서 그 말들을 문서로 확인했습니다. 발표 25건을 IEEE 802.3과 802.1의 회의록, 표결 기록, 일정표와 맞춰 보고, 칩 회사의 주장은 미국과 상하이의 공시에서 매출과 이익률로 다시 읽었습니다. 발표자가 한 말과 문서가 다르면 둘 다 적었습니다.

막힌 곳은 속도 표준 쪽에 있지 않습니다. 엣지의 규격과 생산 공정, 카메라 링크에 먼저 깔린 SerDes, 고장에 대비하는 소프트웨어가 다음 단계를 붙잡고 있습니다. 엣지 이더넷 양산 조건 10개의 점검표, 2030년까지의 표준과 양산 일정표, 칩 시장 규모의 두 가지 계산과 가정을 실었습니다. IEEE, IEEE SA, OPEN Alliance를 비롯한 어느 단체나 회사와도 관계없이 LIMEN RESEARCH가 독립적으로 조사했습니다.

### 이 책이 답하는 질문
1. 양산차의 백본은 왜 1 Gb/s에 머물러 있는가
2. 엣지 이더넷의 양산 조건 10개 가운데 무엇이 풀렸고 무엇이 남았는가
3. 카메라 링크는 이더넷 표준 802.3dm과 SerDes 가운데 어디로 가는가
4. 차량용 이더넷 칩 시장은 얼마이고 중국은 어디까지 왔는가
5. 2027년에 어떤 날짜를 확인하면 되는가
"""
