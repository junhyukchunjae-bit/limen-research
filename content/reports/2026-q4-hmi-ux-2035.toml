body = """
2022년 여름 스웨덴의 자동차 잡지 Vi Bilägare는 신차 열한 대와 2005년형 볼보 V70에 같은 네 과업을 시켰습니다. 버튼만 있는 열일곱 살 볼보가 10.0초로 가장 빨랐고, 가장 느린 신차는 44.9초가 걸렸습니다. 이 시험은 버튼이 화면을 이긴 증거로 널리 인용됐지만, 결과표를 끝까지 읽으면 기능을 덜어낸 터치 화면 차가 버튼이 많고 메뉴가 복잡한 차보다 두 배 넘게 빨랐습니다. 이 책은 그 표를 끝까지 읽는 방식으로 썼습니다.

2026년에 실제로 바뀐 것은 규칙입니다. 유럽 신차 평가 프로그램(Euro NCAP)은 1월부터 방향지시등, 비상등, 와이퍼 같은 필수 기능 8개에 손으로 누르는 조작부가 있는지를 점수로 매기고, EU는 7월부터 운전자의 시선을 보는 카메라 경고를 모든 신규 등록 차의 의무로 만들었습니다. 중국은 2월 물리 조작부를 요구하는 강제 표준 개정안을 내놓았습니다. 이 책은 2026년 11월까지 양산과 고객 인도가 확인된 것만 차종과 시점으로 적고, 유럽, 미국, 중국, 일본, 한국, 인도와 UN의 규정과 평가 66건을 조항 단위로 견줬습니다.

조사하면서 통념과 다른 숫자를 여럿 만났습니다. 물리 버튼을 되살리겠다고 밝힌 완성차 다섯 곳 가운데 양산차에서 조작부가 늘어난 것이 분명한 곳은 한 곳입니다. 2025년 상반기 세계 중앙 화면 출하는 2.0% 늘었고 같은 기간 헤드업 디스플레이는 25.3% 늘었습니다. 차에 들어온 대화형 음성 비서 24건 가운데 비서 자체로 요금을 받는 곳은 하나입니다. 양산 전 기술은 발표와 실제 양산 사이의 간격을 재서, 그 간격을 넣은 2035년 세 시나리오로 계산했습니다. 외부 의뢰 없이 LIMEN RESEARCH가 독립적으로 조사했습니다.

### 이 책이 답하는 질문
1. 차량 HMI 시장은 얼마이고, 누가 공급하며, 지역마다 무엇이 다른가
2. 2024–2026년 양산 운전석의 조작계, 화면, HUD, 실내 센서는 어떻게 바뀌었나
3. 콕핏 OS, 폰 프로젝션, LLM 음성 비서에서 돈을 버는 곳은 어디인가
4. 2초, 12초 같은 숫자 기준은 어디서 왔고, 2026–2029년에 어떤 규정과 평가가 시행되나
5. 양산 전 기술은 언제 차에 들어오고, 2035년 시장은 얼마가 되나
