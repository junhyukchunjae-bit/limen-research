body = """
2026년 1월부터 7월까지 중국에서 팔린 승용 신차 열 대 가운데 일곱 대에 L2 운전 보조가 실렸고, 2025년 세계 승용 신차의 35.6%가 L2 이상이었습니다. 그런데 운전대에서 손을 떼고 달릴 수 있는 핸즈오프 L2+를 고객에게 인도한 완성차는 세계 판매 상위 30 그룹 가운데 8곳뿐이고, 중국 회사는 없습니다. 중국에서는 운전대를 잡은 채 쓰는 방식만 팔리고, 2027년부터는 강제 표준이 새 차종의 핸즈오프를 막습니다. 개인이 새로 주문할 수 있는 L3 차는 2026년 10월 어디에도 없습니다.

이 책은 다섯 언어의 공개 자료 1,815건(공시·법령·표준·당국 자료 등 1차 자료 592건)으로 완성차 30곳과 공급사 100여 곳, 여섯 영역, 8개 지역의 법을 같은 틀에 놓았습니다. 맥킨지·골드만삭스·S&P Global Mobility·Yole을 비롯한 리서치 기관과 투자은행 13곳의 전망 31건을 원 값 그대로 이 책의 세 시나리오와 대조했습니다. LIMEN RESEARCH가 본 2035년 L3 비중은 7.4%로, 기관 전망(L3 이상 17–24%)의 절반이 안 됩니다.

가정을 모두 밝힌 2035년 세 시나리오, 선행지표 12개의 기준선, 기능 단계별 하드웨어 원가, 기업 프로파일 45곳과 데이터 팩을 2027년 이후의 조달·투자·보험·정책 결정에 쓸 수 있는 형태로 정리했습니다. 외부 의뢰 없이 LIMEN RESEARCH가 독립적으로 조사했습니다.

### 이 책이 답하는 질문
1. L2+와 L3는 2030년과 2035년에 신차의 몇 %에 실리고, 기관 13곳의 전망 31건과 어디서 갈리는가
2. 중국 도심 NOA 하드웨어 원가는 왜 2026년에 하락을 멈췄고 2030년에는 어디로 가는가
3. 주행 칩·라이다·소프트웨어 라이선스·컨트롤러 가운데 이익은 어느 층에 남는가
4. AI 모델로 바뀐 주행 소프트웨어를 합격시킬 숫자는 어느 규정에 있고, 없다면 무엇이 대신하는가
5. 2027년에 몰린 확정 날짜 여섯 개와 선행지표 12개로 시나리오를 어떻게 채점하는가
"""
