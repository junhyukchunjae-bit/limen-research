body = """
2026년 9월, 글로벌 전기차 판매가 처음으로 1년 전보다 줄었습니다. 215만 대, 2% 감소입니다. 같은 달 차에 실린 전지는 늘었습니다. 2026년 1–9월로 넓혀 보면 전기차 판매는 3% 늘어 거의 멈췄지만, 차에 실린 전지는 19.7% 늘었습니다. 대수와 GWh가 따로 움직이는 시장이 된 것입니다.

판매 대수를 세는 보고서는 많지만, 그 대수가 셀 업체의 주문서에서 몇 GWh, 어떤 화학, 몇 C의 충전 속도, 어느 나라 공장의 셀이 되는지를 한 틀로 꿰어 읽는 보고서는 없었습니다. 이 책은 그 계산을 셀 수요 환산이라고 부르고, 2027년에 결정되는 것들을 이 환산으로 읽습니다. 6개 언어의 출처와 공시를 접수 번호까지 찾아 완성차 20곳의 전동화 약속을 평가하고, 중국 본토 밖 셀 공장 34곳을 일람으로 정리했습니다.

2027년은 세 지역이 서로 다른 규칙으로 움직이는 첫해입니다. 미국은 연방 세액 공제와 연비 벌금이 함께 사라진 첫 완전한 해를 맞고, 유럽은 2025–2027년 3년 평균으로 CO2 목표를 처음 정산하며, 중국은 구매세 반감의 마지막 해에 전지 수출 환급을 없앱니다. 2027년 확정 날짜 21건의 달력, 2030년 셀 수요 환산표와 시나리오 가정표, 기업 34곳 프로파일과 데이터 팩을 담았습니다. 외부 의뢰 없이 LIMEN RESEARCH가 독립적으로 조사했습니다.

### 이 책이 답하는 질문
1. 2027년 승용 전기차 셀 수요는 몇 GWh이고, 미국 BEV 점유율 1%p는 비중국계 셀 업체에 몇 GWh인가
2. 완성차 20곳 가운데 누가 전동화 목표를 지켰고, 해지된 셀 계약과 매각된 합작 공장 지분은 몇 GWh인가
3. 2027년에 완성차는 어떤 셀을, 얼마에, 어디서 만든 것으로 사는가
4. 보급형 전기차는 800 V로 가는가, 희토류 없는 모터는 통제 뒤에 늘었는가
5. 2030년 셀 수요 2,237 GWh의 방향은 2027년의 어떤 일정에서 정해지는가
"""
