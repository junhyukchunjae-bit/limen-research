summary = "CES 2027 혁신상 349건의 설명문을 전부 읽고 세어, 로봇·AI·칩·모빌리티·건강·기기·집의 일곱 흐름과 직군별 동선, 부스 질문, 출장 보고서 양식을 정리했습니다."
