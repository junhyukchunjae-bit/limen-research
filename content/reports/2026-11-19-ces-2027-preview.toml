quote_source = "책 소개"
body = """
CES 2027 혁신상 349건의 설명문을 전부 읽고 세었습니다. 최고혁신상을 받은 휴머노이드는 예약 판매 단계이고, CES 2026의 발표는 시기를 밝힌 30건 가운데 17건이 제때 나왔습니다.

CES 2027은 2027년 1월 6일부터 9일까지 라스베이거스에서 열립니다. 이 책은 수상작이 발표된 직후, 행사 두 달 전에 나오는 미리보기입니다. 수상 페이지 349건, 공식 전시사 목록에 오른 3,388곳, CES 2026 발표 42건의 1년 뒤를 2026년 11월 10일 기준으로 확인했습니다. 혁신상은 출품료를 내고 출품해 기준점을 넘으면 받는 상이고, 주최 측은 수상 제품을 시험하거나 보증하지 않습니다. 그래서 회사가 한 말과 원문으로 확인한 사실을 가려 적었습니다.

4장부터 6장까지는 로봇, 대신 해 주는 AI, 칩, 모빌리티, 건강, 기기, 집의 일곱 흐름을 다룹니다. 흐름마다 주최 측의 설명, 수상작과 전시 예고가 보여 주는 것, 이 책의 해석, 현장에서 확인할 것을 차례로 적었습니다. 출장 가는 독자에게는 직군별로 갈 홀과 미리 약속할 회의실, 부스에서 물을 질문, 사전 보고서와 귀국 보고서의 양식을 드립니다. 가지 않는 독자는 수상작 349건 전체 목록과 날짜별 확인 표로 전시를 따라갈 수 있습니다.

### 이 책이 답하는 질문
1. 상을 받은 로봇과 AI 가운데 살 수 있는 것은 무엇인가
2. CES 2026에서 약속한 제품은 1년 뒤 얼마나 나왔나
3. 어느 홀과 호텔 회의실에 누가 있고, 누가 전시 부스를 내지 않나
4. 부스에서 무엇을 물어야 값, 날짜, 생산, 허가를 알 수 있나
5. 사전 보고서와 귀국 보고서 첫 쪽에 무엇을 쓰나
"""
