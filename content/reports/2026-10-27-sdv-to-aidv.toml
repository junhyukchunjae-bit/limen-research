summary = "차의 두뇌를 이루는 칩·운영체제·주행 모델·연결 네 층에서 이익이 어디에 쌓였는지 공시로 확인하고, 완성차 24곳과 두뇌 공급사 12곳, 여섯 지역을 같은 틀로 조사했습니다."
quote = "세계 판매 상위 20개 자동차 그룹 가운데 10곳은 2026년 이미 중국에서 파는 차와 그 밖에서 파는 차에 서로 다른 두뇌를 쓴다."
quote_source = "요약 09 · 6장"
body = """
2025년 7월, BMW와 메르세데스-벤츠, 아우디가 중국에서 파는 차의 운전 보조 소프트웨어를 모두 중국 회사 모멘타에 맡겼다는 보도가 나왔습니다. 같은 해 1월 미국 상무부는 중국·러시아와 연결된 회사의 차량 연결 소프트웨어를 2027년형부터 미국 차에서 빼라는 규정을 확정했습니다. 같은 브랜드의 차가 중국에서는 중국 회사의 두뇌로 달리고, 미국에서는 그 두뇌와 이어진 코드를 쓸 수 없게 된 것입니다.

소프트웨어 정의 차량(SDV)은 회사들이 말한 날짜보다 늦게 왔고, 돈은 완성차보다 차의 두뇌를 이루는 층에 먼저 쌓였습니다. 소프트웨어 관련 금액을 꾸준히 공시하는 완성차는 조사 대상 24곳 가운데 셋이고, 2026년 공시로 확인되는 두뇌의 이익은 칩과 메모리, 인증 커널의 로열티, 통신망 요금에 있었습니다.

이 책은 영어·중국어·일본어·독일어·한국어 다섯 언어의 공개 문서 1,761건으로 완성차 24곳, 두뇌 공급사 12곳, 자체 소프트웨어 조직 10곳, 여섯 지역을 조사했습니다. 그 가운데 715건이 공시·보도자료·공식 통계·표준 원문 같은 1차 자료입니다. 두뇌 조달 매트릭스, 두 스택 지도, 다섯 동인의 시나리오 가정표, 선행지표 12개를 2027–2030년 조달·투자·조직 결정에 쓸 수 있는 형태로 정리했습니다. 외부 의뢰 없이 LIMEN RESEARCH가 독립 수행했습니다.

### 이 책이 답하는 질문
1. 소프트웨어가 차를 정의한다는 말은 누가 먼저 썼고, 판매 상위 40종은 실제로 어디쯤인가
2. 같은 'SDV 시장'이 244배 벌어지는 이유와 2035년 기준·비관·낙관 시나리오는 무엇인가
3. 칩·OS·모델·연결 네 층에서 이익은 어디에 쌓였고 완성차가 쥘 수 있는 층은 어디까지인가
4. 완성차 24곳 가운데 두뇌를 스스로 만든 곳은 몇이고, 상위 20개 그룹의 절반은 왜 두 스택을 운영하는가
5. 두뇌 약속 30건에서 제때 나온 쪽은 무엇이 달랐고, 2027–2030년에 무엇을 정해야 하는가
"""
