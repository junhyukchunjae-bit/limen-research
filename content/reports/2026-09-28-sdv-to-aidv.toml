body = """
사업계획서와 증권사 보고서, 정부 발표에 소프트웨어 정의 차량(SDV)이라는 말이 오르지 않는 날이 드뭅니다. 2024년부터는 AI 정의 차량(AIDV)이 그 옆에 붙었습니다. 이 보고서는 두 가지를 확인합니다. 이 말들이 정확히 무엇을 가리키는지, 그리고 그 말에 걸린 돈이 실제로 누구에게 가는지입니다.

결론을 미리 정하지 않고 검증할 수 있는 가설 18개를 세운 뒤 장마다 자료로 판정했습니다. 이번 판에서 판정한 여섯 개 가운데 둘은 지지됐고 넷은 절반쯤 맞았습니다.

### 이번 판의 구성
- **1장 SDV라는 말은 누가 만들었나**: SDV 기원설 네 가지를 원문과 대조하고, AIDV라는 말의 출처를 바로잡고, 25개월 사이에 나온 성숙도 등급표 여덟 개를 한 눈금에 올립니다.
- **5장 소프트웨어는 돈이 되는가**: 2035년 시장 전망이 244배 벌어지는 이유, 테슬라와 GM이 공개한 구독 숫자, 폭스바겐 카리아드와 현대차그룹 포티투닷이 치른 수업료를 계산합니다.

여섯 장으로 설계한 전체판 가운데 두 장을 실은 테스트판입니다. 나머지 장에서 검증할 가설 열두 개는 부록에 판정하지 않은 채로 남겨 두었습니다.
"""
