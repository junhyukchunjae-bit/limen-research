body = """
2026년 2월, 캐나다 온타리오의 도요타 공장 TMMC는 Agility Robotics의 Digit 일곱 대를 1년 동안 시험한 뒤 월 요금을 내고 쓰기로 했습니다. 한 달 뒤 중국 항저우의 Unitree는 상장 신청서에 2025년 휴머노이드 생산 5,716대, 출하 5,511대, 판매 5,215대를 따로 밝혔습니다. 휴머노이드는 2026년 연간 출하가 5만 대 안팎으로 예상되는 산업이 됐지만, 유료 계약으로 공장이나 창고에서 상시 가동되는 로봇은 아직 손에 꼽힙니다. 공개된 공장과 물류 현장 26곳 가운데 유료 계약과 대수가 함께 공개된 곳은 세 곳, 약 35대입니다.

이 책은 그 격차를 공개 자료로 확인했습니다. 발표 건수 대신 대수와 계약 형태와 운영 기록을 보고, 공개된 원가 분해 여섯 건과 다섯 나라 부품사 30곳의 공시를 읽고, 기관 18곳의 전망을 발표 시점별로 다시 정렬했습니다. 중국 회사의 상장 신청서와 정부 공고, 일본 부품사의 유가증권보고서, 독일 부품사의 투자자 자료, 미국의 증권거래위원회 공시와 연방 법안을 원문 언어로 읽었고, 핵심 수치 122개를 하나의 기준표로 맞춰 그 가운데 75개를 성격이 다른 두 번째 출처로 교차 확인했습니다.

2025–2026년에 나온 기관 여섯 곳의 2035년 연간 출하 전망은 70만–1,000만 대로 흩어져 있고 중앙값은 약 565만 대입니다. LIMEN RESEARCH의 기준 시나리오는 구매나 사용료 지급이 확인되는 수요를 부문별로 아래에서 위로 합산해 약 51만 대로 봅니다. 이 값이 낮게 잡혔다는 신호(2027년 재주문 5건 초과, 중국 밖 제조사의 평균 고장 간격 공개, 테슬라의 외부 인도)도 미리 정해 두었습니다. 외부 의뢰 없이 LIMEN RESEARCH가 독립적으로 조사했습니다.

### 이 책이 답하는 질문
1. 2026년 휴머노이드는 몇 대가 팔렸고, 그 가운데 몇 대가 공장에서 돈을 받고 일하는가
2. 같은 2025년의 세계 출하가 기관에 따라 7,000대에서 1만 8,600대까지 갈리는 이유는 무엇인가
3. 한 대의 원가는 어느 부품에 몰려 있고, 2030년까지 어디에서 가장 많이 내려가는가
4. 공장이 요구하는 성공률과 고장 간격은 어디까지 공개됐는가
5. 2035년 대수를 제약하는 것은 비용인가 현장 배치 속도인가, 2027년에 무엇을 보면 알 수 있는가
